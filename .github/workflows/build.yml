name: Build

# Проверка сборки на каждом пуше и PR. Релизы собирает release.yml по тегу.
on:
  push:
    # Обе рабочие ветки: dev — разработка, release — то, что уедет в релиз.
    branches: [dev, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Не android-actions/setup-android: он дёргает `sdkmanager tools`, а пакет
      # tools удалён из репозитория Google и шаг валит сборку. На образе runner
      # cmdline-tools уже есть — принимаем licenses, а недостающие компоненты
      # (platform 36.1, build-tools) доставит сам AGP.
      - name: Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Юнит-тесты (экономия, формат размеров) + сборка APK.
      - name: Тесты и сборка
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      # Артефакт удобно тянуть из вкладки Actions, не дожидаясь релиза.
      - name: Приложить APK
        uses: actions/upload-artifact@v4
        with:
          name: eBrake-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14