name: Release

# Релиз = тег вида v0.1.0. Workflow собирает подписанный APK и вешает его
# в GitHub Releases, откуда его и качают.
on:
  push:
    tags: ['v*']
  # Ручной запуск без тега — чтобы пересобрать APK того же тега:
  # Actions → Release → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, к которому привязать сборку (например v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Не android-actions/setup-android: он дёргает `sdkmanager tools`, а пакет
      # tools удалён из репозитория Google и шаг валит сборку. На образе runner
      # cmdline-tools уже есть — принимаем licenses, а недостающие компоненты
      # (platform 36.1, build-tools) доставит сам AGP.
      - name: Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ключ подписи лежит в Secrets. Без него release соберётся под debug-ключ:
      # APK скачивается и ставится, но не обновляет ранее установленную версию.
      - name: Восстановить ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Секрета нет → переменные остаются пустыми, и build.gradle.kts сам
          # откатится на debug-подпись (release не должен падать из-за ключа).
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись: release-ключ из Secrets."
          else
            echo "Секрета ANDROID_KEYSTORE_BASE64 нет — собираем под debug-ключ."
          fi

      - name: Определить версию
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Тесты и сборка release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      # Имя файла = версия из тега: в Releases видно, что качаешь, и старые
      # версии не перетирают друг друга.
      - name: Подготовить артефакт
        id: apk
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="eBrake-${VERSION}.apk"
          cp "$SRC" "$DST"
          echo "name=$DST" >> "$GITHUB_OUTPUT"
          # SHA-256: пользователь может сверить файл после скачивания.
          sha256sum "$DST" > "eBrake-${VERSION}.apk.sha256"
          ls -lh "$DST"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: eBrake ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      # Блочный скаляр обязателен: в одной строке `run: echo "Готово: ..."`
      # есть «двоеточие с пробелом», YAML считает это новым ключом, и workflow
      # отклоняется проверкой схемы — без единого выполненного шага.
      - name: Итог
        run: |
          echo "Готово: eBrake-${{ steps.ver.outputs.tag }}.apk в Releases"